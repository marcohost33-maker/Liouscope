  citable_archival_release: OPEN

verification_commands:
  install: "pip install -e .[dev,qutip]"
  test: "pytest --cov=liouscope --cov-fail-under=80"
  anchors: "pytest tests/test_anchors.py"
  reproduce_paper: "python benchmarks/reproduce_paper.py"
  figures: "python figures/generate_all.py"
  lint: "ruff check src/ tests/"

