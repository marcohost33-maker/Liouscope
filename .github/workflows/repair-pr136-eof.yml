name: One-shot PR136 EOF repair

on:
  push:
    branches:
      - "chatgpt/issue-130-scaled-norms"

permissions:
  contents: write

concurrency:
  group: pr136-eof-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'marcohost33-maker/Liouscope'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Append exactly one missing terminal newline
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path("src/liouscope/numerics/linalg.py"),
              Path("tests/test_pr121_review_round20.py"),
              Path("tests/test_pr121_review_round23.py"),
          ]
          for path in targets:
              before = path.read_bytes()
              if before.endswith(b"\n"):
                  raise SystemExit(f"{path}: expected the known missing-EOF-newline defect")
              after = before + b"\n"
              path.write_bytes(after)
              if path.read_bytes() != after or after[:-1] != before:
                  raise SystemExit(f"{path}: byte-preservation invariant failed")

          workflow = Path(".github/workflows/repair-pr136-eof.yml")
          workflow.unlink()
          Path(".pr136-eof-repair.marker").write_text(
              "one-shot EOF repair completed; delete this marker via the external GitHub connector to trigger final PR CI\n",
              encoding="utf-8",
          )

      - name: Verify change surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/repair-pr136-eof.yml",
              ".pr136-eof-repair.marker",
              "src/liouscope/numerics/linalg.py",
              "tests/test_pr121_review_round20.py",
              "tests/test_pr121_review_round23.py",
          }
          observed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          names = {line[3:] for line in observed}
          if names != expected:
              raise SystemExit(f"unexpected repair surface: {sorted(names)}")
          PY

      - name: Commit byte-only repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "liouscope-eof-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(#130): restore terminal newlines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
