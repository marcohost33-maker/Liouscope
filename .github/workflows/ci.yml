name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,qutip]
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/liouscope
        continue-on-error: true
      - name: Run anchor regressions (must pass)
        run: pytest tests/test_anchors.py -v
      - name: Run full test suite
        run: pytest --cov=liouscope --cov-report=xml --cov-fail-under=80 -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  docs:
    name: Docs (Sphinx build)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build Sphinx HTML
        run: python -m sphinx -b html docs docs/_build/html
      - name: Build Sphinx HTML in strict mode (warnings as errors)
        # ``--keep-going`` collects every defect on a single run.
        # Intersphinx network failures are common on hosted CI when the
        # public Python docs site is briefly unreachable; we accept
        # those by allowing the step to soft-fail.
        run: python -m sphinx -W --keep-going -b html docs docs/_build/strict
        continue-on-error: true
      - name: Upload built docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  build-smoke:
    name: Build smoke (sdist + wheel + twine check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine "pkginfo>=1.12" "packaging>=24.2" validate-pyproject[all]
      - name: Validate pyproject.toml
        run: python -m validate_pyproject pyproject.toml
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install built wheel into a clean venv and import
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import liouscope; print('liouscope', liouscope.__version__, liouscope.TAXONOMY_VERSION)"
          /tmp/wheel-check/bin/python -m liouscope version
      - name: Upload built artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-smoke
          path: dist/
          retention-days: 7

  benchmark-smoke:
    name: Benchmark smoke (tolerance-compare against goldens)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qutip]"
      - name: Manifest <-> golden-file byte integrity gate
        # In-repo file SHA-256; byte-stable across platforms because the
        # golden file is what we committed.
        run: pytest tests/test_benchmark_manifest_integrity.py -v
      - name: Re-run each BM-NNN and tolerance-compare against goldens
        # We deliberately do NOT byte-hash the runner output here.
        # Cross-platform BLAS / LAPACK backends produce LSB-level float
        # differences that change the JSON SHA even when the underlying
        # physics is identical. ``test_benchmark_outputs.py`` does a
        # per-field deep-compare with a 1e-9 tolerance, which is the
        # correct check for runtime regression.
        run: pytest tests/test_benchmark_outputs.py -v -m slow
