name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,qutip]
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/liouscope
        continue-on-error: true
      - name: Run anchor regressions (must pass)
        run: pytest tests/test_anchors.py -v
      - name: Run full test suite
        run: pytest --cov=liouscope --cov-report=xml --cov-fail-under=80 -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  docs:
    name: Docs (Sphinx build)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build Sphinx HTML
        run: python -m sphinx -b html docs docs/_build/html
      - name: Upload built docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  build-smoke:
    name: Build smoke (sdist + wheel + twine check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine "pkginfo>=1.12" "packaging>=24.2" validate-pyproject[all]
      - name: Validate pyproject.toml
        run: python -m validate_pyproject pyproject.toml
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install built wheel into a clean venv and import
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import liouscope; print('liouscope', liouscope.__version__, liouscope.TAXONOMY_VERSION)"
          /tmp/wheel-check/bin/python -m liouscope version
      - name: Upload built artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-smoke
          path: dist/
          retention-days: 7

  benchmark-smoke:
    name: Benchmark smoke (BM-001 / BM-003 / BM-003b)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qutip]"
          pip install pyyaml
      - name: Run benchmark BM-001
        run: python benchmarks/run.py BM-001 --output /tmp/bm001.json
      - name: Run benchmark BM-003
        run: python benchmarks/run.py BM-003 --output /tmp/bm003.json
      - name: Run benchmark BM-003b
        run: python benchmarks/run.py BM-003b --output /tmp/bm003b.json
      - name: Compare BM-003 hash to manifest expectation
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          expected = "8c84d04c4c341d1f0e95e3e409f57079477f1c12668a9c63a4518eaa36dceadf"
          path = pathlib.Path("/tmp/bm003.json")
          payload = path.read_text(encoding="utf-8")
          got = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          print("expected:", expected)
          print("got     :", got)
          if got != expected:
              print("BM-003 hash drift detected", file=sys.stderr)
              sys.exit(1)
          PY
