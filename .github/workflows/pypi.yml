name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # manueller Guard-Beweis-Lauf (Job skipt ohne PYPI_PUBLISH_ENABLED)

permissions: {}

jobs:
  build-and-publish:
    # [2026-06-06; comment refreshed 2026-06-26] Template-Guard: Trusted
    # Publishing ist fuer dieses (oeffentliche) Forschungs-Repo auf PyPI noch
    # nicht konfiguriert -> Job failte bei jedem Release ("Trusted publishing
    # exchange failure", 05-21 + 05-28). Aktivierung nach echtem PyPI-Setup:
    # Repo-Variable PYPI_PUBLISH_ENABLED=true setzen (s. docs/RELEASE_AUDIT_v0.5.0).
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liouscope
    permissions:
      id-token: write   # Trusted Publishing to PyPI — required, do not remove
      contents: read    # checkout the release tag
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install build + QA tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents
      - name: Build sdist + wheel
        run: python -m build
      - name: Release QA gate (fail-closed before upload)
        # twine check --strict: long-description renders on PyPI, metadata sane.
        # check-wheel-contents: no stray tests/.pyc/empty-wheel packaging bugs.
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          # Print the SHA-256 of each uploaded distribution to the run log so the
          # release-evidence lock can record digests without a separate step. The
          # PyPA action already generates + uploads PEP 740 attestations by default
          # under Trusted Publishing; do NOT add a second attest step (PyPI rejects
          # duplicate predicates / >2 attestations per file).
          print-hash: true
