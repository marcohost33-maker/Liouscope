name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # build/QA dry-run only; never grants an OIDC publish token

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install build + QA tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents
      - name: Build sdist + wheel
        run: python -m build
      - name: Release QA gate
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify source, artifact, tag and commit identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(python -c 'import runpy; print(runpy.run_path("src/liouscope/_version.py")["__version__"])')"
          DIST_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("liouscope"))')"
          test "$SOURCE_VERSION" = "$DIST_VERSION"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Manual dry-run verified version=$SOURCE_VERSION at commit=$EVENT_SHA; no publish credentials exist in this job."
            exit 0
          fi
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          test "$SOURCE_VERSION" = "$EXPECTED_VERSION"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$EVENT_SHA" = "$TAG_SHA"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liouscope
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/
      - name: Re-verify release identity before upload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          SOURCE_VERSION="$(python -c 'import runpy; print(runpy.run_path("src/liouscope/_version.py")["__version__"])')"
          DIST_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("liouscope"))')"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_VERSION" = "$DIST_VERSION"
          test "$SOURCE_VERSION" = "$EXPECTED_VERSION"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$EVENT_SHA" = "$TAG_SHA"
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          print-hash: true
