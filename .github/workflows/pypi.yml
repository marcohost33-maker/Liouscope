name: Publish to PyPI

on:
  release:
    types: [published]
  # Release dry-run. The build job below runs on every pull request and every
  # push to main, so the hash-locked toolchain, the build, the QA gate and the
  # reproducibility check are exercised long before a release depends on them
  # (PyPA's publishing guide builds on every push for the same reason). Only
  # `publish` can upload, and it runs solely for a published release.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # build/QA dry-run only; never grants an OIDC publish token

permissions: {}

# Superseded dry-runs of the same pull request are cancelled; a release run is
# never cancelled (cancel-in-progress is false for every other event).
concurrency:
  group: pypi-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      # The release toolchain installs from a hash lock: every distribution,
      # transitive ones included, must match a recorded SHA-256, and
      # --only-binary keeps an sdist's build script from running here. The
      # unpinned `pip install --upgrade pip` is gone rather than pinned: the
      # interpreter's bundled pip already supports hash-checking mode.
      # Block scalar, not an inline value: `:all: ` inside a plain YAML scalar
      # is a mapping indicator and makes the whole file unparsable.
      - name: Install build + QA tools (hash-locked)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/release.txt
      # --no-isolation builds with the setuptools locked above. An isolated
      # build would download whatever setuptools satisfies pyproject.toml at
      # that moment -- the one unpinned input left in the artifact's build.
      #
      # SOURCE_DATE_EPOCH (the commit time) makes the wheel byte-reproducible,
      # and the second, clean build proves it on every run: the wheel must be
      # byte-identical and the sdist content-identical (setuptools' sdist
      # ignores SOURCE_DATE_EPOCH, pypa/setuptools#2133, so its mtimes and
      # owner fields are the only thing the comparison disregards). A build
      # that is not a deterministic function of commit + lock cannot publish.
      - name: Build sdist + wheel twice and verify reproducibility
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation --outdir dist
          rm -rf build src/*.egg-info
          python -m build --no-isolation --outdir "$RUNNER_TEMP/rebuild"
          {
            echo "### Release artifacts (event: $GITHUB_EVENT_NAME, commit: $(git rev-parse HEAD), SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH)"
            echo '```'
            python .github/scripts/compare_dists.py dist "$RUNNER_TEMP/rebuild"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release QA gate
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify source, artifact, tag and commit identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(python -c 'import runpy; print(runpy.run_path("src/liouscope/_version.py")["__version__"])')"
          DIST_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("liouscope"))')"
          test "$SOURCE_VERSION" = "$DIST_VERSION"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Dry-run ($GITHUB_EVENT_NAME) verified version=$SOURCE_VERSION at commit=$EVENT_SHA; no publish credentials exist in this job."
            exit 0
          fi
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          test "$SOURCE_VERSION" = "$EXPECTED_VERSION"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$EVENT_SHA" = "$TAG_SHA"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          # Dry-run artifacts are evidence for a few days; a release keeps 90.
          retention-days: ${{ github.event_name == 'release' && 90 || 7 }}

  publish:
    needs: build
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liouscope
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/
      - name: Re-verify release identity before upload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          SOURCE_VERSION="$(python -c 'import runpy; print(runpy.run_path("src/liouscope/_version.py")["__version__"])')"
          DIST_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("liouscope"))')"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_VERSION" = "$DIST_VERSION"
          test "$SOURCE_VERSION" = "$EXPECTED_VERSION"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$EVENT_SHA" = "$TAG_SHA"
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}"
          done
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          print-hash: true
