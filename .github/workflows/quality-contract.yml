# Quality Contract Gate — claim safety + workflow hardening.
# This is intentionally fast and dependency-free. It should be safe as a required
# check because it runs on every PR (including stacked PRs) and has no path filters.
name: Quality Contract

on:
  pull_request:
  push:
    branches: [main, "claude/**", "codex/**", "bot/**"]
  workflow_dispatch:

permissions: {}

jobs:
  contract:
    name: quality contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Check workflow hardening
        run: python .github/scripts/check_workflow_hardening.py
      - name: Check documented agent branch trigger coverage
        run: python .github/scripts/check_agent_branch_triggers.py
      - name: Check documentation claim safety
        run: python .github/scripts/check_claim_safety.py
