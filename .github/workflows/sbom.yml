name: SBOM (CycloneDX)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom.cdx.json
          cyclonedx-py environment --output-format xml -o sbom.cdx.xml
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
          retention-days: 90
      - name: Attach to release (if event is release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.xml
