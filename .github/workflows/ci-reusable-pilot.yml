# B3-Pilot (2026-06-04): zentrale Reusable-CI aus coworkerz-ci, ADDITIV neben
# der bestehenden ci.yml (kein Ersatz, kein BP-Touch) - verifiziert nur, dass
# der workflow_call-Pfad flottentauglich gruen laeuft. SHA-gepinnt (nie @main).
#
# Fail-soft (2026-06-26): der Aufruf des PRIVATEN coworkerz-ci Reusable-Workflows
# scheitert strukturell, sobald der aufrufende Lauf keinen Lesezugriff auf das
# private Repo hat (Cross-Repo-`workflow_call` aufloest dann zu NULL Jobs ->
# Run = failure mit leerer Jobliste, z.B. auf PR #58/#60). Das ist KEIN Defekt
# im liouscope-Code und der Pilot ist ADDITIV (kein Required-Check). Damit ein
# externer Zugriffs-Ausfall nicht jeden PR dauerhaft rot faerbt, ist der Pilot
# jetzt hinter einer opt-in Repo-Variable gegated (gleiches Idiom wie pypi.yml
# `PYPI_PUBLISH_ENABLED`). Wieder-Aktivierung nach wiederhergestelltem Zugriff:
# Repo-Variable `REUSABLE_CI_PILOT_ENABLED=true` setzen.
#
# Warum ein `if:`-Gate und NICHT `continue-on-error`? GitHub unterstuetzt
# `continue-on-error` auf Job-Ebene NICHT fuer Jobs, die per `uses:` einen
# Reusable-Workflow aufrufen (offene Limitierung, community discussions
# #77915/#159265). Ein `if:`-Guard ist daher der einzige Mechanismus, diesen
# Reusable-Caller nicht-blockierend zu machen.
#
# ECHTE Root-Cause-Fix (nicht in dieser additiven Workflow-Datei loesbar):
# Der private coworkerz-ci-Repo muss Lesezugriff fuer Liouscope freigeben
# (coworkerz-ci -> Settings -> Actions -> General -> "Access" -> Accessible from
# repositories owned by 'marcohost33-maker'), sonst loest der Cross-Repo-
# `workflow_call` weiterhin zu NULL Jobs auf. Quelle: GitHub Docs, "Sharing
# actions and workflows from your private repository". Dieser Gate ist die
# Defense-in-Depth-Schicht, damit ein erneuter Zugriffsverlust nicht wieder
# jeden PR rot faerbt.
name: ci-reusable-pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # Opt-in Guard: ohne gesetzte Variable wird der Job uebersprungen (neutral),
    # statt am unreachable Cross-Repo-`workflow_call` mit leerer Jobliste zu
    # failen. Siehe Kopfkommentar fuer Re-Aktivierung.
    if: vars.REUSABLE_CI_PILOT_ENABLED == 'true'
    # Pin auf privates coworkerz-ci: SHA-Echtheit wird bei jedem Bump via
    # gh api Pre/Post verifiziert (zizmor laeuft offline, s. zizmor.yml).
    uses: marcohost33-maker/coworkerz-ci/.github/workflows/ci-python.yml@511ae1bd35092429ddb8fb08e340a3c2c8bc9406
    with:
      python-version: "3.12"
      install-command: 'pip install -e ".[dev]" pytest-cov'
      ruff-target: "src tests benchmarks"
      mypy-target: "src/liouscope"
      pytest-args: "--cov=liouscope --cov-fail-under=80 -q"
