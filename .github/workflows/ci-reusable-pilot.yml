# B3-Pilot (2026-06-04): zentrale Reusable-CI aus coworkerz-ci, ADDITIV neben
# der bestehenden ci.yml (kein Ersatz, kein BP-Touch) - verifiziert nur, dass
# der workflow_call-Pfad flottentauglich gruen laeuft. SHA-gepinnt (nie @main).
name: ci-reusable-pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # zizmor impostor-commit kann private Cross-Repos nicht lesen (repo-scoped
    # GITHUB_TOKEN); SHA wird stattdessen bei jedem Bump via gh api Pre/Post
    # verifiziert. Audit hier seit 06-04 deshalb faelschlich rot.
    uses: marcohost33-maker/coworkerz-ci/.github/workflows/ci-python.yml@511ae1bd35092429ddb8fb08e340a3c2c8bc9406 # zizmor: ignore[impostor-commit]
    with:
      python-version: "3.12"
      install-command: 'pip install -e ".[dev]" pytest-cov'
      ruff-target: "src tests benchmarks"
      mypy-target: "src/liouscope"
      pytest-args: "--cov=liouscope --cov-fail-under=80 -q"
