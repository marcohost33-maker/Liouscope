# OpenSSF Scorecard — supply-chain security health metrics
# Docs: https://github.com/ossf/scorecard-action
#
# Note: Scorecard requires read access to the GitHub GraphQL API. On private
# repos without GitHub Advanced Security this fails with "Resource not
# accessible by integration"; the `if:` guard keeps the job skipped there.
# This repo is PUBLIC (since 2026-06), so the job runs and results are
# published to the Scorecard REST API (badge-capable).
name: OpenSSF Scorecard

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"   # Mondays 06:37 UTC
  push:
    branches: ["main"]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard cannot run on private repos without GHAS — skip to keep CI green.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to Code Scanning — required
      id-token: write          # Scorecard OIDC for publish/attestation — required
      contents: read           # checkout + repo metadata — required
      actions: read            # Scorecard reads workflow run data — required

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde  # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publish to the Scorecard REST API so the score is
          # badge-capable and externally auditable (uses the job's id-token).
          publish_results: true

      - name: Upload artifact
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: results.sarif
