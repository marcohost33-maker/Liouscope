name: Bug report
description: Report a numerical or behavioural defect in LiouScope
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Before submitting, please confirm
        the issue is **not** a numerical-stability question that requires physics-domain
        interpretation — those belong in Discussions, not Issues.

  - type: input
    id: version
    attributes:
      label: LiouScope version
      description: Output of `python -c "import liouscope; print(liouscope.__version__)"`
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version + platform
      placeholder: "3.12 / macOS 14.5 / arm64"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: |
        Smallest snippet that reproduces the issue. If the bug is dependent on numerical seed,
        please call `liouscope.io.seed.seed_everything(SEED)` first.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: Run-manifest excerpt (optional but very helpful)
      description: |
        Paste the relevant part of the JSON manifest (`liouscope.io.manifest.export(...)`) — at
        least the `versions`, `lattice`, and `dissipator` sections so reproducibility is anchored.
      render: json
    validations:
      required: false
